                quả xuất hiện tại đây khi tiến trình nền nhận tác vụ.
            labels:
              process: Tiến trình nền
              checked_at: Đã kiểm tra
              configuration: Cấu hình
            configuration_statuses:
              match: Khớp với web
              mismatch: Khác với web
            statuses:
              passing: Đạt
              failing: Không đạt
              stale: Cũ
            settings_origin:
              title: Cài đặt nào cần khởi động lại?
              database_backed: Cài đặt nhà cung cấp, mô hình và khóa API thay đổi trong Cài đặt → Tự lưu trữ được
                lưu trong cơ sở dữ liệu. rails-settings-cached vô hiệu hóa bộ nhớ đệm dùng chung khi ghi, nên cả
                web và tiến trình nền sẽ đọc giá trị mới cho yêu cầu hoặc tác vụ tiếp theo, không cần khởi động
                lại.
              env_backed: Cấu hình embedding và mọi giá trị chỉ đặt qua biến môi trường được cố định khi từng container
                khởi động. Rails không thể thay đổi môi trường của container khác, nên cần khởi động lại hoặc tạo
                lại cả dịch vụ web và tiến trình nền. Công cụ triển khai chỉ khởi động lại một dịch vụ (triển khai
                một phần, cập nhật Secret mà không khởi động lại pod) sẽ không nhận được thay đổi.
          local_setup:
            title: Thiết lập cục bộ được khuyến nghị
            description: Chạy LLM qua endpoint cục bộ tương thích OpenAI, lưu vector tài liệu trong pgvector và
              trỏ cài đặt embedding tới endpoint embedding tương thích OpenAI. Image PostgreSQL phải có tiện ích
              vector và số chiều embedding phải khớp mô hình đã chọn.
