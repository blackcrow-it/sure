          run_checks: Chạy lại kiểm tra
          last_checked: Kiểm tra trực tiếp hoàn tất %{time_ago} trước. Kết quả được lưu đệm trong thời gian ngắn.
          not_checked_help: Mở trực tiếp URL trạng thái AI hoặc chạy kiểm tra để xác minh dịch vụ đang hoạt động.
          loading: Đang chạy kiểm tra trực tiếp…
          alerts:
            custom_openai:
              title: Kiểm tra kho vector lưu trữ thất bại tại endpoint tùy chỉnh này
              message: Endpoint đã cấu hình không vượt qua kiểm tra hoạt động /v1/vector_stores. Hầu hết endpoint
                cục bộ và tương thích OpenAI không triển khai API này. Trò chuyện và xử lý PDF có thể vẫn hoạt động;
                với thiết lập cục bộ thông thường, hãy dùng pgvector cùng endpoint embedding riêng. Lỗi đã được
                ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            function_calling_unsupported:
              title: Mô hình không hỗ trợ gọi hàm
              message: Endpoint xử lý được yêu cầu trò chuyện thông thường nhưng từ chối cùng yêu cầu khi có tham
                số tools. Trợ lý AI đọc tài khoản, giao dịch và khoản nắm giữ qua lời gọi hàm, nên trò chuyện sẽ
                tiếp tục thất bại, thường với lỗi 404 không rõ nguyên nhân, cho đến khi dùng mô hình hỗ trợ công
                cụ. Hãy chọn mô hình được nhà cung cấp xác nhận hỗ trợ gọi hàm. Lỗi đã được ghi vào Cài đặt → Nhật
                ký gỡ lỗi và Rails.logger.
            function_calling_not_used:
              title: Mô hình trả lời mà không gọi công cụ được yêu cầu
              message: Endpoint chấp nhận tham số tools nhưng mô hình trả lời bằng văn bản thay vì gọi công cụ kiểm
                tra tình trạng. Trợ lý AI không thể đọc dữ liệu tài chính nếu không gọi công cụ, nên có thể trả
                lời trống hoặc bịa số liệu. Ưu tiên mô hình được nhà cung cấp xác nhận hỗ trợ gọi hàm.
            llm_probe_failed:
              title: Kiểm tra trực tiếp LLM thất bại
              message: Sure không thể xác minh cả endpoint lẫn mô hình đã cấu hình. Lỗi đã được ghi vào Cài đặt
                → Nhật ký gỡ lỗi và Rails.logger.
            llm_model_not_available:
              title: Mô hình AI đã cấu hình không khả dụng
              message: Endpoint đã phản hồi nhưng không liệt kê hoặc phục vụ mô hình đã cấu hình. Chọn mô hình đang
                hoạt động của nhà cung cấp đã chọn rồi chạy lại kiểm tra. Với Gemini qua lớp chuyển đổi tương thích
                OpenAI, hãy dùng mô hình hiện được hỗ trợ như gemini-3.8-flash.
            pdf_text_extraction_failed:
              title: Kiểm tra trích xuất văn bản PDF giả lập thất bại
              message: 'Sure không thể hoàn tất luồng ưu tiên văn bản: trích xuất văn bản nhúng trong PDF tại máy
                rồi gửi tới mô hình đã cấu hình. Không có dữ liệu khách hàng được gửi đi. Lỗi đã được ghi vào Cài
                đặt → Nhật ký gỡ lỗi và Rails.logger.'
            pdf_vision_processing_failed:
              title: Kiểm tra PDF giả lập bằng thị giác/xử lý gốc thất bại
              message: Sure không thể hoàn tất luồng xử lý PDF bằng hình ảnh hoặc tài liệu gốc qua mô hình đã cấu
                hình. Không có dữ liệu khách hàng được gửi đi. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            vector_probe_failed:
              title: Kiểm tra trực tiếp tìm kiếm tài liệu thất bại
              message: Sure không thể xác minh kho vector đã chọn và tất cả dịch vụ embedding cần thiết. Lỗi đã
                được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            pgvector_extension_not_enabled:
              title: Chưa bật tiện ích mở rộng vector của PostgreSQL
              message: Đã chọn adapter pgvector nhưng PostgreSQL chưa bật tiện ích mở rộng vector cho cơ sở dữ liệu
                này. Hãy dùng image PostgreSQL có pgvector, bật tiện ích bằng tài khoản chủ cơ sở dữ liệu hoặc superuser
                rồi chạy lại migrations với VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Thiếu bảng vector_store_chunks
              message: Tiện ích pgvector đã bật nhưng không tìm thấy bảng chunks. Kiểm tra trạng thái migration
                rồi chạy lại migration kho vector với VECTOR_STORE_PROVIDER=pgvector để Sure tạo vector_store_chunks.
            pgvector_probe_failed:
              title: Kiểm tra lưu trữ pgvector thất bại
              message: Sure không thể truy vấn bảng chunks của pgvector. Kiểm tra quyền PostgreSQL, tiện ích vector
                và migration vector_store_chunks. Lỗi đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            embedding_dimensions_mismatch:
              title: Số chiều embedding không khớp
              message: Endpoint embedding trả về vector có độ dài không khớp EMBEDDING_DIMENSIONS. Đặt EMBEDDING_MODEL
                và EMBEDDING_DIMENSIONS theo kích thước vector được công bố của mô hình, khởi động lại Sure để áp
                dụng môi trường, rồi sửa hoặc tạo lại cột/bảng embedding pgvector và tạo lại embedding cho tài liệu
                nếu dữ liệu cũ dùng kích thước khác.
            embedding_probe_timeout:
              title: Kiểm tra trực tiếp embedding hết thời gian chờ
              message: Endpoint embedding không phản hồi trong AI_HEALTH_PROBE_TIMEOUT. Tăng thời gian chờ kiểm
                tra nếu nhà cung cấp chậm, rồi khởi động lại Sure để áp dụng môi trường cho mọi tiến trình. Nếu
                lời gọi trò chuyện AI thông thường cũng hết thời gian chờ, hãy tăng riêng OPENAI_REQUEST_TIMEOUT.
            embedding_probe_failed:
              title: Kiểm tra trực tiếp embedding thất bại
              message: Sure không thể tạo embedding thử nghiệm ngắn qua endpoint và mô hình đã cấu hình. Kiểm tra
                EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN và nhật ký nhà cung cấp embedding. Lỗi
                đã được ghi vào Cài đặt → Nhật ký gỡ lỗi và Rails.logger.
            qdrant:
              title: Chưa triển khai hỗ trợ Qdrant
              message: Adapter Qdrant đã có khung nhưng thao tác tải lên và tìm kiếm tài liệu hiện vẫn thất bại.
                Hãy chọn OpenAI hoặc pgvector để tìm kiếm tài liệu.
            missing_vector_store:
              title: Chưa cấu hình kho vector
              message: Không thể lập chỉ mục hoặc tìm kiếm tài liệu đã tải lên cho đến khi cấu hình adapter kho
                vector cùng các yêu cầu của nó.
            unavailable_vector_store:
              title: Kho vector đã chọn không khả dụng
              message: Kiểm tra các yêu cầu adapter bên dưới. Với pgvector, cơ sở dữ liệu phải có tiện ích vector
                hoặc bảng vector_store_chunks hiện có.
          llm:
