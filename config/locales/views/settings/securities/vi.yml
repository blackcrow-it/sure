        encryption_warning:
          title: Thiếu khóa mã hóa
          intro: 'Dữ liệu nhạy cảm (khóa API, token nhà cung cấp, bí mật MFA và thông tin nhận dạng cá nhân) đang
            được lưu không mã hóa. Để bật mã hóa, đặt các khóa sau trong biến môi trường hoặc Rails credentials:'
          keys:
          - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          generate: 'Tạo bộ khóa bằng: bin/rails db:encryption:init'
