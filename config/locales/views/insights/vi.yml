        khoản phí đã chuyển ngày.'
      savings_rate_change:
        up: Từ %{from_month} đến %{to_month}, tỷ lệ tiết kiệm so với thu nhập tháng thông thường là %{current_rate}%,
          tăng %{change_pp} điểm phần trăm từ %{previous_rate}% trong ba tháng trước đó.
        down: Từ %{from_month} đến %{to_month}, tỷ lệ tiết kiệm so với thu nhập tháng thông thường là %{current_rate}%,
          giảm %{change_pp} điểm phần trăm từ %{previous_rate}% trong ba tháng trước đó.
        down_negative: 'Từ %{from_month} đến %{to_month}, bạn chi nhiều hơn thu: tỷ lệ tiết kiệm giảm xuống %{current_rate}%
          từ %{previous_rate}% trong ba tháng trước đó.'
      idle_cash: '%{account} có %{balance} và không có hoạt động trong %{idle_days} ngày qua.'
      budget_at_risk:
        over: '%{categories} đã vượt ngân sách tháng này. Bạn đã dùng %{budget_spent_pct}% tổng ngân sách.'
        near: '%{categories} gần chạm giới hạn tháng này. Bạn đã dùng %{budget_spent_pct}% tổng ngân sách.'
      budget_on_track: Bạn đã chi %{spent} trên ngân sách %{budgeted} (%{budget_spent_pct}%) và mọi khoản đều trong
        giới hạn.
      bill_not_covered: '%{name} với số tiền %{amount} đến hạn %{due_on} từ %{account}. Tính cả hóa đơn và thu nhập
        khác đã lên lịch trên tài khoản đến thời điểm đó, sẽ thiếu khoảng %{shortfall}.'
