        below: Theo tốc độ hiện tại, bạn sẽ chi %{projected_spend} cho %{category} tháng này, thấp hơn khoảng %{deviation_pct}%
          so với trung bình tháng gần đây là %{baseline_spend}.
      cash_flow_warning:
        low: Dựa trên giao dịch định kỳ sắp tới và mức chi tiêu thông thường, số dư tiền mặt có thể giảm còn %{projected_low}
          khoảng %{projected_low_date}.
        negative: Dựa trên giao dịch định kỳ sắp tới và mức chi tiêu thông thường, số dư tiền mặt có thể xuống %{projected_low}
