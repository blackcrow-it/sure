        up: Khoản trả %{account} thay đổi từ %{previous_payment} sang %{new_payment} vào %{effective_on}, tăng %{change_pct}%,
          theo lịch khoản vay và lãi suất đã ghi nhận.
        down: Khoản trả %{account} thay đổi từ %{previous_payment} sang %{new_payment} vào %{effective_on}, giảm
          %{change_pct}%, theo lịch khoản vay và lãi suất đã ghi nhận.
