---
vi:
  admin:
    system_health:
      hosted_usage:
        loading: Đang tải số liệu sử dụng dịch vụ lưu trữ…
        title: Sử dụng dịch vụ lưu trữ
        snapshot: Ảnh chụp cơ sở dữ liệu chỉ đọc tại %{time}
        summary:
          trial_households_count: Hộ gia đình dùng thử (30 ngày qua)
          trial_members_count: Tài khoản thành viên dùng thử hiện tại
          trials_expiring_soon_count: Lượt dùng thử hết hạn trong 7 ngày tới
          cleanup_eligible_count: Hộ gia đình đủ điều kiện dọn dẹp
          active_supporter_households_count: Hộ gia đình ủng hộ đang hoạt động (nội bộ)
          supporter_subscription_count: Bản ghi đăng ký liên kết Stripe
        summary_help: Tổng số dùng thử bao gồm đăng ký được ghi nhận trong 30 ngày qua. Tổng số sắp hết hạn, đủ
          điều kiện dọn dẹp và người ủng hộ bao gồm mọi bản ghi hiện tại phù hợp, không bị giới hạn bởi bảng.
        limitations_title: Ý nghĩa của các số liệu này
        limitations: Các bảng hiện tại không lưu toàn bộ lịch sử dùng thử, thanh toán hoặc hoạt động phiên. Thời
          điểm tạo đăng ký có thể phản ánh việc nhập dữ liệu. Tài khoản thành viên không được xác minh là những
          người riêng biệt. Trang này không thay đổi dữ liệu hộ gia đình hay đăng ký. Việc đặt lại bản demo dùng
          chung xóa hộ gia đình và phiên cũ, nên không thể tái dựng lịch sử khách truy cập.
        trials:
          title: Hộ gia đình dùng thử gần đây
          description: Đăng ký được ghi nhận từ %{date} còn lưu ngày kết thúc dùng thử, bao gồm lượt dùng thử đã
            chuyển đổi. Hiển thị tối đa %{limit} hộ gia đình.
          sessions_help: Phiên là bản ghi đăng nhập còn lưu của người dùng được bật, không phải người đang trực
            tuyến hay lượt truy cập. Đăng xuất sẽ xóa bản ghi. Thời điểm tạo mới nhất không phải thời điểm hoạt
            động gần nhất.
          empty: Không có hộ gia đình dùng thử được ghi nhận trong khoảng này
        cleanup:
          title: Điều kiện dọn dẹp
          description: 'Khớp phạm vi dọn dẹp hiện có: đăng ký tạm dừng hoặc dùng thử đã kết thúc hơn 14 ngày, hoặc
            không có đăng ký và hộ gia đình đã tồn tại hơn 45 + 14 ngày. Hiển thị tối đa %{limit} hộ gia đình.'
          eligibility_help: Đăng nhập gần đây không ngăn bản ghi khớp điều kiện. Đủ điều kiện không có nghĩa là
            đã xóa; 90 ngày là thời gian giữ bản lưu trữ, không phải ngưỡng dọn dẹp dùng thử.
          disabled: Dọn dẹp dùng thử theo lịch bị tắt ngoài chế độ được quản lý. Đây chỉ là các bản ghi khớp phạm
            vi.
          empty: Không có hộ gia đình khớp phạm vi dọn dẹp
          reasons:
            expired_trial_grace_elapsed: Dùng thử đã kết thúc; đã qua thời gian gia hạn 14 ngày
            no_subscription_grace_elapsed: Không có đăng ký; đã qua 45 + 14 ngày
        supporters:
          title: Trạng thái người ủng hộ nội bộ
          description: Các bản ghi đăng ký nội bộ hiện tại có ID khách hàng và đăng ký theo định dạng Stripe; không
            bao gồm đăng ký demo giả lập. Trạng thái không xác minh khoản tiền đã nhận hoặc ngày thanh toán đầu
            tiên. Không có yêu cầu nào được gửi tới Stripe.
          empty: Không có bản ghi đăng ký liên kết Stripe
        columns:
          household: ID hộ gia đình
          recorded_at: Thời điểm ghi nhận đăng ký
          trial_ends_at: Kết thúc dùng thử
          status: Trạng thái hiện tại
          members: Tài khoản thành viên
          retained_sessions: Phiên đăng nhập còn lưu
          recent_sessions: Phiên còn lưu được tạo trong 30 ngày qua
          latest_session: Đăng nhập mới nhất còn lưu
          cleanup_eligible: Đủ điều kiện dọn dẹp
          cleanup_reason: Lý do
          subscription_rows: Bản ghi đăng ký
        statuses:
          unknown: Không xác định
          incomplete: Chưa hoàn tất
          incomplete_expired: Chưa hoàn tất, đã hết hạn
          trialing: Đang dùng thử
          active: Hoạt động
          past_due: Quá hạn
          canceled: Đã hủy
          unpaid: Chưa thanh toán
          paused: Không hoạt động
          no_subscription: Không có gói đăng ký
        not_recorded: Chưa ghi nhận
        eligible: Đủ điều kiện
        not_eligible: Không đủ điều kiện
        synthetic_demo: Demo giả lập
      push_notifications:
        send_test: Gửi thông báo đẩy thử nghiệm
        queueing: Đang đưa vào hàng đợi…
        title: Thông báo đẩy
        requested_at: Lần thử mới nhất được yêu cầu lúc %{time}
        result_help: APNs chấp nhận không xác nhận thông báo đã đến thiết bị. Làm mới để xem kết quả từ tiến trình
          nền. Kết quả được lưu trong 24 giờ.
        results_label: Kết quả thử nghiệm
        device: Thiết bị %{number}
        pending: Đang chờ
        refresh: Làm mới kết quả
        columns:
          device: Thiết bị
          environment: Môi trường APNs
          status: Kết quả
          checked_at: Cập nhật lần cuối
        environments:
          sandbox: Sandbox
          production: Production
        messages:
          enqueue_failed: Không thể đưa thử nghiệm vào hàng đợi. Kiểm tra Sidekiq rồi làm mới kết quả bên dưới.
          ready: Gửi thông báo thử nghiệm đến các thiết bị iOS đã bật và đăng ký với tài khoản của bạn.
          queued: Đã đưa thông báo thử nghiệm vào hàng đợi. Làm mới kết quả bên dưới để kiểm tra trạng thái.
          hosted_only: Thông báo đẩy chỉ khả dụng trong chế độ dịch vụ lưu trữ.
          ineligible: Chỉ quản trị viên cấp cao đang hoạt động mới có thể gửi thông báo thử nghiệm.
          no_devices: Bật thông báo đẩy trong ứng dụng Sure trên iOS cho tài khoản này để gửi thử nghiệm.
          disabled: Người vận hành đã tắt gửi thông báo đẩy.
          not_configured: Chưa cấu hình thông tin xác thực APNs.
          cooldown: Vui lòng đợi 30 giây trước khi gửi thử nghiệm khác.
          storage_unavailable: Không thể lưu yêu cầu thử nghiệm. Kiểm tra cấu hình bộ nhớ đệm dùng chung.
        statuses:
          queued: Đang chờ
          accepted: Được APNs chấp nhận
          skipped: 'Đã bỏ qua: không còn đủ điều kiện'
          rejected: Bị APNs từ chối; kiểm tra nhật ký gỡ lỗi thông báo đẩy
          unregistered: Đăng ký thiết bị không còn hợp lệ
          retrying: Đang thử lại sau lỗi tạm thời
          failed: Thất bại; kiểm tra nhật ký gỡ lỗi thông báo đẩy
          enqueue_failed: Không thể đưa vào hàng đợi; kiểm tra Sidekiq
          expired: Đã hết hạn mà chưa có kết quả cuối cùng
      push_notification:
        title: Thông báo thử nghiệm Sure
        body: Đây là thông báo đẩy thử nghiệm cho tài khoản Sure của bạn.
      verify_worker_ai:
        queued: Đã đưa kiểm tra tiến trình nền vào hàng đợi. Kết quả sẽ xuất hiện bên dưới khi tiến trình nhận tác
          vụ, thường trong vài giây.
      optional_services:
        title: Dịch vụ tùy chọn
        description: Tích hợp tùy chọn cho người vận hành. Dịch vụ chưa cấu hình chỉ mang tính thông tin. Các kiểm
          tra này chỉ xem cài đặt; không kiểm tra kết nối, gửi sự kiện thử nghiệm hay thay đổi sự đồng ý về phân
          tích. Mở rộng dịch vụ để xem hướng dẫn thiết lập.
        missing_settings: 'Cài đặt còn thiếu: %{settings}'
        statuses:
          configured: Đã cấu hình
          not_configured: Chưa cấu hình
          incomplete: Cấu hình chưa đầy đủ
          disabled: Đã tắt trong tiến trình này
          not_checked: Chưa xác minh
        notes:
          environment_disabled: Tích hợp đã tải bị tắt trong môi trường Rails này.
          explicitly_disabled: SKYLIGHT_ENABLED đã tắt rõ ràng việc đo hiệu năng.
          self_hosted_checkout_disabled: Thanh toán đăng ký và cổng thanh toán bị tắt trong chế độ tự lưu trữ. Vẫn
            có thể cấu hình webhook Stripe; không cần ID giá thanh toán ở đây.
          browser_analytics_disabled: Phân tích trình duyệt bị tắt trong môi trường này. Điều này không tắt client
            phía máy chủ được cấu hình riêng.
          shared_feedback_configured: Phản hồi cho bản tự lưu trữ có dự án tích hợp riêng và được bật theo cấu hình.
            Không cần POSTHOG_KEY của người vận hành. Kiểm tra này không xét lựa chọn từ chối trên trình duyệt hay
            tính khả dụng của SDK.
          shared_feedback_disabled: Dự án phản hồi riêng cho bản tự lưu trữ bị tắt bởi cài đặt phản hồi hoặc môi
            trường. Điều này không tắt phân tích thuộc người vận hành.
          production_only: Theo cấu hình hiện tại của ứng dụng, tích hợp này chỉ được dùng trong production.
        services:
          langfuse:
            title: Langfuse
            description: Theo dõi AI và báo cáo đánh giá tùy chọn. Kiểm tra này không gửi trace hoặc yêu cầu đánh
              giá.
            guidance: Đặt đồng thời LANGFUSE_PUBLIC_KEY và LANGFUSE_SECRET_KEY. LANGFUSE_HOST là tùy chọn. Khởi
              động lại các dịch vụ liên quan sau khi thay đổi.
          sentry:
            title: Sentry
            description: Báo cáo lỗi và hiệu năng tùy chọn. Bộ khởi tạo hiện tại chỉ bật báo cáo trong production.
            guidance: Đặt SENTRY_DSN rồi khởi động lại các dịch vụ liên quan. Kiểm tra này xem cấu hình SDK đã tải
              mà không ghi nhận lỗi hoặc gửi sự kiện.
          skylight:
            title: Skylight
            description: Đo hiệu năng ứng dụng tùy chọn. Có cấu hình không xác nhận agent đang chạy hoặc gửi báo
              cáo.
            guidance: Đặt SKYLIGHT_AUTHENTICATION và bảo đảm Skylight được tải trong môi trường Rails mong muốn.
              SKYLIGHT_ENABLED=false tắt đo hiệu năng; riêng cờ này không tải gem. Khởi động lại sau khi thay đổi.
          stripe:
            title: Stripe
            description: Thanh toán đăng ký và webhook thanh toán tùy chọn. Kiểm tra này không tạo client Stripe,
              xác minh thông tin xác thực hay gửi yêu cầu thanh toán.
            guidance: Đặt đồng thời STRIPE_SECRET_KEY và STRIPE_WEBHOOK_SECRET. Thanh toán đăng ký được quản lý
              còn cần STRIPE_MONTHLY_PRICE_ID và STRIPE_ANNUAL_PRICE_ID.
          posthog:
            title: PostHog
            description: Phân tích tùy chọn do người vận hành sở hữu, sử dụng cấu hình được tải khi khởi động. Đã
              cấu hình không có nghĩa là người dùng đã đồng ý cho phân tích.
            guidance: Đặt POSTHOG_KEY và POSTHOG_HOST không rỗng, hoặc không đặt host để dùng mặc định. Phân tích
              trình duyệt yêu cầu production hoặc POSTHOG_DEVELOPMENT_ENABLED trong development. POSTHOG_FEEDBACK_ENABLED
              điều khiển phản hồi riêng cho bản tự lưu trữ, không điều khiển phân tích của người vận hành.
          logtail:
            title: Logtail
            description: Chuyển tiếp nhật ký production tùy chọn. Khi chưa cấu hình, ứng dụng tiếp tục ghi nhật
              ký ra đầu ra tiêu chuẩn.
            guidance: Đặt đồng thời LOGTAIL_API_KEY và LOGTAIL_INGESTING_HOST rồi khởi động lại các dịch vụ liên
              quan. Kiểm tra này không phát sinh nhật ký thử nghiệm.
      configuration:
        description: Cấu hình mà tiến trình web này thấy được. Các kiểm tra không gửi email, liên hệ nhà cung cấp
          hay tải tệp lên hoặc xuống. Đã cấu hình nghĩa là có cài đặt, không xác nhận khả năng gửi, truy cập nhà
          cung cấp hay truy cập lưu trữ.
        statuses:
          configured: Đã cấu hình
          not_configured: Chưa cấu hình
          incomplete: Cấu hình chưa đầy đủ
          disabled: Đã tắt
          not_checked: Chưa xác minh
        settings_needed: Cài đặt cần xem lại
        unknown_provider: Lựa chọn nhà cung cấp không được nhận diện
        provider_statuses:
          configured: Đã cấu hình
          not_configured: Thiếu khóa API
          invalid: Lựa chọn không hợp lệ
        configure_providers: Mở cài đặt tự lưu trữ
        storage_backend: 'Lưu trữ đã chọn: %{backend}'
        storage_backends:
          local: Ổ đĩa cục bộ
          test: Ổ đĩa thử nghiệm
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: Lưu trữ tương thích S3
          google: Google Cloud Storage
          other: Backend tùy chỉnh hoặc không được nhận diện
        checks:
          smtp:
            title: Email (SMTP)
            statuses:
              configured: Đã có cài đặt SMTP.
              not_configured: Chưa cấu hình SMTP. Không thể gửi email đặt lại mật khẩu, lời mời và email hệ thống
                khác qua SMTP.
              incomplete: Một số cài đặt email còn thiếu hoặc chưa đầy đủ. Email hệ thống hoặc liên kết trong email
                có thể không hoạt động.
              disabled: Chức năng gửi email bị tắt trong cấu hình mailer đang chạy.
              not_checked: Tiến trình này dùng phương thức gửi khác SMTP, chẳng hạn bản xem trước khi phát triển.
                Khả năng gửi SMTP không được đánh giá.
            guidance: Không thể cấu hình SMTP trong giao diện quản trị. Đặt biến môi trường email cho cả dịch vụ
              web và tiến trình nền, rồi khởi động lại cả hai. Có thể bỏ cả SMTP_USERNAME và SMTP_PASSWORD khi dùng
              relay không cần xác thực.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (số từ 1 đến 65535)
              sender: EMAIL_SENDER (thay địa chỉ mặc định sender@sure.local)
              app_domain: APP_DOMAIN (dùng trong liên kết email)
              authentication: SMTP_USERNAME và SMTP_PASSWORD (cung cấp cả hai hoặc bỏ cả hai)
          securities:
            title: Giá thị trường
            statuses:
              configured: Tất cả nhà cung cấp giá thị trường được bật đều đã có cấu hình.
              not_configured: Các nhà cung cấp giá thị trường được bật còn thiếu khóa API. Không thể tự động tìm
                chứng khoán và tra cứu giá qua các nhà cung cấp này.
              incomplete: Ít nhất một nhà cung cấp giá thị trường được bật còn thiếu cấu hình hoặc có lựa chọn không
                hợp lệ. Chứng khoán được gán cho nhà cung cấp đó có thể không được cập nhật giá.
              disabled: Chưa bật nhà cung cấp giá thị trường nào. Không thể tự động tìm chứng khoán và tra cứu giá.
            guidance: Chọn nhà cung cấp và thêm khóa API cần thiết trong cài đặt tự lưu trữ, hoặc cấu hình trong
              môi trường triển khai. Giá trị ghi đè từ môi trường được ưu tiên. Nhà cung cấp công khai không cần
              khóa API.
          exchange_rates:
            title: Tỷ giá ngoại tệ
            statuses:
              configured: Nhà cung cấp tỷ giá đã chọn có cấu hình.
              not_configured: Chưa cấu hình nhà cung cấp tỷ giá có thể sử dụng. Quy đổi tiền tệ tự động có thể không
                khả dụng khi thiếu tỷ giá đã lưu.
            guidance: Chọn nhà cung cấp tỷ giá và thêm khóa API nếu cần trong cài đặt tự lưu trữ, hoặc cấu hình
              trong môi trường triển khai. EXCHANGE_RATE_PROVIDER và khóa API ghi đè từ biến môi trường được ưu
              tiên.
            issues:
              invalid_provider: Nhà cung cấp tỷ giá đã chọn không được nhận diện. Tra cứu tỷ giá tự động sẽ thất
                bại cho đến khi chọn nhà cung cấp được hỗ trợ.
          storage:
            title: Tải lên và lưu trữ tệp
            statuses:
              configured: Đã có cài đặt lưu trữ; ổ đĩa cục bộ không cần thông tin xác thực đám mây.
              not_configured: Backend lưu trữ đã chọn không có cấu hình tương ứng. Chức năng tải tệp lên có thể
                không khả dụng.
              incomplete: Cài đặt lưu trữ bắt buộc còn thiếu hoặc chưa đầy đủ. Tải lên hoặc truy xuất tệp có thể
                không hoạt động.
              not_checked: Backend này dùng cơ chế tìm thông tin xác thực bên ngoài hoặc cấu hình tùy chỉnh. Không
                thể xác định khả năng truy cập chỉ từ các cài đặt này.
            guidance: Kiểm tra ACTIVE_STORAGE_SERVICE và cài đặt triển khai của backend đã chọn. Ổ đĩa cục bộ cần
              vùng lưu trữ bền vững dùng chung cho dịch vụ web và tiến trình nền. Đổi backend không di chuyển tệp
              hiện có; hãy lập kế hoạch di chuyển riêng.
            issues:
              root: Thư mục gốc lưu trữ cục bộ
              bucket: Bucket lưu trữ
              region: Vùng lưu trữ
