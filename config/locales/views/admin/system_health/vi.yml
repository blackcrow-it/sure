          worker:
            title: Xác minh tiến trình nền
            description: Các kiểm tra bên trên chạy từ tiến trình web này. Hầu hết tác vụ AI — phản hồi trợ lý,
              xử lý PDF, embedding, tự động phân loại và nhận diện đơn vị giao dịch — thực tế chạy trong tiến trình
              Sidekiq, có thể khác về truy cập mạng, DNS, quy tắc proxy hoặc thông tin xác thực đã tải. Hãy đưa
              kiểm tra vào hàng đợi để xác minh cấu hình và kết nối của chính tiến trình nền.
            verify_button: Xác minh cấu hình tiến trình nền
            coverage_notice: Mỗi kiểm tra chỉ xác minh đúng một tiến trình nền nhận tác vụ đó. Khi có nhiều bản
              sao tiến trình nền, kết quả đạt không xác nhận tất cả đều hoạt động tốt; hãy đưa kiểm tra vào hàng
              đợi lần nữa để lấy mẫu khác.
