        compromised_secret_warning:
          title: Khóa mã hóa không thực sự bí mật
          intro: Khóa mã hóa của bản cài đặt này được tự suy ra từ giá trị SECRET_KEY_BASE từng được cung cấp làm
            mặc định hoạt động trong tệp Docker Compose mẫu của dự án. Bất kỳ ai biết giá trị đó đều tính được cùng
            khóa, nên dữ liệu không thực sự được bảo vệ.
          generate: 'KHÔNG chỉ đặt SECRET_KEY_BASE mới rồi chạy tác vụ backfill: nếu dữ liệu đã được mã hóa bằng
            khóa bị lộ, backfill không phân biệt được bản mã với văn bản thuần và sẽ mã hóa chồng, khiến không thể
            khôi phục. Hãy đổi khóa an toàn khi ứng dụng đã dừng: tạo khóa mới bằng bin/rails db:encryption:init
            và đặt các biến ACTIVE_RECORD_ENCRYPTION_*, rồi chạy bin/rails "security:backfill_encryption[100,0]"
            với SECRET_KEY_BASE này trong biến ACTIVE_RECORD_ENCRYPTION_PREVIOUS_SECRET_KEY_BASE chỉ cho lệnh đó,
            để dữ liệu cũ vẫn giải mã và chuyển sang khóa mới. Xem hướng dẫn Docker tự lưu trữ.'
          settings_secrets: Khóa API và token lưu trong cài đặt được mã hóa bằng khóa suy ra trực tiếp từ SECRET_KEY_BASE,
            không thuộc cơ chế trước. Sau khi đổi SECRET_KEY_BASE, mã hóa lại bằng bin/rails "security:rotate_setting_secrets[0]",
            truyền giá trị cũ trong OLD_SECRET_KEY_BASE (xem hướng dẫn Docker tự lưu trữ). Nhập lại khóa được báo
            không thể giải mã.
